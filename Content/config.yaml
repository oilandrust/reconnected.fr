site:
  # Left empty on purpose: each page's `::: seo` block sets <title> and description.
  title: ""
  url: "https://www.re-connected.fr"
  basePath: ""
  lang: fr

brand: "Re-Connected"

# Cookieless pageviews (EU-hosted). Empty / omit to disable.
analytics:
  goatcounter: "https://overlii.goatcounter.com/count"

template: reconnected
home: "Accueil.md"
# The parent folder (~/Projects) is an Obsidian vault: keep asset lookup inside Content/.
vault: .

author:
  name: "Olivier Rouiller"
  avatar: "Assets/olivier-rouiller.webp"
  links:
    email: "o.rouiller@gmail.com"
    resalib: "https://www.resalib.fr/praticien/134586-olivier-rouiller-psychopraticien-strasbourg"
    blog: "https://www.olivier-psy.fr/fr/"

# Menus are defined per language below (`languages.*.menu`).
navigation: []

# Content links `[Text](#booking)`, `[Text](#discovery)`, `[Text](#email)` and `[Text](#phone)` resolve to these.
contact:
  email: "o.rouiller@gmail.com"
  phone: "+33662913203"
  # Practice address, used in the ProfessionalService JSON-LD.
  address:
    street: "3, place de Haguenau"
    postalCode: "67000"
    city: "Strasbourg"
    country: "FR"
  # Cal.com event types for the `::: calendly` booking chooser.
  events:
    - href: "https://cal.com/olivier-rouiller/consultation-en-visio"
      fr:
        title: "Consultation en visio"
        detail: "Par Zoom"
        duration: "50 min"
        cta: "Choisir un créneau"
      en:
        title: "Online consultation"
        detail: "Via Zoom"
        duration: "50 min"
        cta: "Pick a time"
    - href: "https://cal.com/olivier-rouiller/consultation-en-cabinet"
      fr:
        title: "Consultation en cabinet"
        detail: "À Strasbourg"
        duration: "50 min"
        cta: "Choisir un créneau"
      en:
        title: "In-person consultation"
        detail: "In Strasbourg"
        duration: "50 min"
        cta: "Pick a time"
    - href: "https://cal.com/olivier-rouiller/premier-contact"
      featured: true
      fr:
        title: "Premier contact gratuit"
        detail: "En visio (Zoom)"
        duration: "20 min"
        cta: "Réserver l’appel"
      en:
        title: "Free discovery call"
        detail: "Online (Zoom)"
        duration: "20 min"
        cta: "Book the call"
  form: "https://formspree.io/f/xjygnblk"
  booking:
    fr: "/contact/#booking"
    en: "/en/contact/#booking"
  # Free 20‑min intro — `#discovery` CTAs open this Cal.com event (modal on desktop).
  discovery: "https://cal.com/olivier-rouiller/premier-contact"
  workshops:
    fr: "mailto:o.rouiller@gmail.com?subject=Ateliers%20Strasbourg"
    en: "mailto:o.rouiller@gmail.com?subject=Workshops%20Strasbourg"

languages:
  fr:
    label: "FR"
    name: "Français"
    locale: "fr_FR"
    jobTitle: "Psychopraticien"
    tagline: "Olivier Rouiller, psychopraticien"
    menu:
      - "Approche": "/approche/"
      - "Séances & tarifs": "/seances-et-tarifs/"
      - "À propos": "/a-propos/"
      # - "Ateliers": "/ateliers/"   # publish Ateliers.md first
      - "Articles": "/les-therapies-somatiques/"
      - "Contact": "/contact/#contact"
    cta:
      label: "Prendre Rendez-vous"
      href: "#booking"
    switchLabel: "This page in English"
    footer:
      safety: "Mon accompagnement n'est pas un soin médical et ne remplace pas un suivi médical, psychiatrique ou psychologique. En cas d'urgence, appelez le 15 ou le 112. Si vous avez des pensées suicidaires, le 3114 (numéro national de prévention du suicide) répond 24 h/24, gratuitement."
      links:
        - "Contact": "/contact/"
        - "Mentions légales": "/mentions-legales/"
        - "Confidentialité": "/mentions-legales/#protection-des-donnees-personnelles"
  en:
    label: "EN"
    name: "English"
    locale: "en_US"
    jobTitle: "Somatic practitioner"
    tagline: "Olivier Rouiller, psychopraticien (EI) · somatic practitioner"
    menu:
      - "Approach": "/en/approach/"
      - "Sessions & fees": "/en/sessions-and-fees/"
      - "About": "/en/about/"
      # - "Workshops": "/en/workshops/"   # publish En/Workshops.md first
      - "Articles": "/en/somatic-therapies/"
      - "Contact": "/en/contact/#contact"
    cta:
      label: "Book a session"
      href: "#booking"
    switchLabel: "Cette page en français"
    footer:
      safety: "My work is not medical care and does not replace medical, psychiatric or psychological treatment. In an emergency, call 112 (or your local emergency number). In France, the national suicide prevention line 3114 is free and available 24/7; outside France, please contact your local crisis line."
      links:
        - "Contact": "/en/contact/"
        - "Legal notice": "/en/legal-notice/"
        - "Privacy": "/en/legal-notice/#data-protection"

# FR ↔ EN page pairs: language switch, hreflang, canonical and sitemap.
routes:
  - { fr: "/", en: "/en/" }
  - { fr: "/approche/", en: "/en/approach/" }
  - { fr: "/seances-et-tarifs/", en: "/en/sessions-and-fees/" }
  - { fr: "/a-propos/", en: "/en/about/" }
  - { fr: "/ateliers/", en: "/en/workshops/" }
  - { fr: "/faq/", en: "/en/faq/" }
  - { fr: "/les-therapies-somatiques/", en: "/en/somatic-therapies/" }
  - { fr: "/contact/", en: "/en/contact/" }
  - { fr: "/mentions-legales/", en: "/en/legal-notice/" }

# Old WordPress URLs → static redirect stubs generated by scripts/postbuild.mjs.
# A target that is not built (e.g. unpublished /ateliers/) falls back to `fallback`.
redirects:
  "/fr/": "/"
  "/hakomi-somatic-mindful-therapy/": "/en/approach/"
  "/about-me/": "/en/about/"
  "/book-a-free-discovery-session/": "/en/contact/"
  "/2025/02/28/les-5-principes-du-circling/": { to: "/ateliers/", fallback: "/approche/" }
  "/fr/2025/02/28/les-5-principes-du-circling/": { to: "/ateliers/", fallback: "/approche/" }
  "/category/circling/": { to: "/ateliers/", fallback: "/approche/" }
  "/category/pratiques-relationelles/": { to: "/ateliers/", fallback: "/approche/" }
  "/author/olivier/": "/a-propos/"
  "/fr/author/olivier/": "/a-propos/"
  "/web/": "/"
  "/web-design-landing-pages/": "/"

# Anchors of the old one-page site, redirected client-side from `/`.
legacyAnchors:
  "#about": "/en/about/"
  "#hakomi": "/en/approach/"
  "#contact": "/en/contact/"
